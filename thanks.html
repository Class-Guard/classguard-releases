<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanks — ClassGuard</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif; padding:0 20px; }
  main { max-width:720px; margin:0 auto; padding:56px 0 calc(56px + env(safe-area-inset-bottom,0px)); }
  a { color:var(--accent); }
  h1 { font-size:2rem; margin:0 0 6px; letter-spacing:-0.01em; }
  h2 { font-size:1.1rem; margin:34px 0 8px; }
  p, li { color:var(--muted); }
  strong { color:var(--ink); }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.95rem; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--ink); font-weight:600; }
  td { color:var(--muted); }
  .wrap { overflow-x:auto; }
  .back { display:inline-block; margin-bottom:28px; text-decoration:none; color:var(--muted); }
</style>
</head>
<body>
<main style="text-align:center">
  <img src="logo.png" alt="" width="72" height="72" style="border-radius:16px;margin:24px auto 20px;display:block">
  <h1>You're all set</h1>
  <p>Go back to ClassGuard. It picks up your plan within a few seconds; if it doesn't, open Settings → Account.</p>
  <p>On your other computer, ClassGuard Pro turns on the next time it checks in, as long as it's signed in to the same account.</p>
  <p style="margin-top:28px"><a href="index.html">ClassGuard home</a> · <a href="privacy.html">Privacy</a></p>
</main>
</body>
</html>
